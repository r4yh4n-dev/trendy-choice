<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart — Trendy Choice</title>
<meta name="description" content="আপনার Trendy Choice শপিং কার্ট — পরিমাণ আপডেট করুন, কুপন প্রয়োগ করুন এবং অর্ডার সম্পন্ন করুন।">
<meta name="theme-color" content="#0a0a0f">
<link rel="canonical" href="cart.html">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c5cff'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>TC</text></svg>">
</head>
<body>
<div id="tc-header"></div>

<main>
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home">হোম</a><span>/</span><span data-i18n="cart.title">শপিং কার্ট</span></div>
    <div class="page-head"><h1 data-i18n="cart.title">শপিং কার্ট</h1></div>
  </div>
  <div class="wrap" id="cart-root"></div>
</main>

<div id="tc-footer"></div>

<script src="data.js"></script>
<script src="app.js?v=3"></script>
<script>
(function(){
  var D = window.TC_DATA;

  function render(){
    var items = TC.cart.get();
    var root = TC.byId('cart-root');

    if (!items.length){
      root.innerHTML = '<div class="empty" style="margin:26px 0 60px">'+
        '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>'+
        '<h3>'+TC.t('cart.empty')+'</h3><p>'+TC.t('cart.emptySub')+'</p>'+
        '<a class="btn btn-primary" href="shop.html">'+TC.t('btn.continue')+'</a></div>';
      return;
    }

    var rows = items.map(function(it){
      var p = TC.product(it.id); if (!p) return '';
      return '<div class="cart-row">'+
        '<a href="product.html?id='+p.id+'"><img src="'+p.img+'" alt="'+TC.esc(p.name[TC.lang])+'" width="96" height="96"></a>'+
        '<div><div class="src">'+TC.esc(TC.supplierName(p.supplier))+'</div>'+
          '<h4><a href="product.html?id='+p.id+'">'+TC.esc(p.name[TC.lang])+'</a></h4>'+
          (it.variant?'<div style="font-size:12.5px;color:var(--text-3)">'+TC.esc(it.variant)+'</div>':'')+
          '<div class="unit">'+TC.money(p.price)+' × '+it.qty+'</div>'+
          '<div class="qty" style="margin-top:10px"><button onclick="TC.cQty(\''+it.key+'\','+(it.qty-1)+')" aria-label="Decrease">−</button>'+
          '<input type="text" value="'+it.qty+'" readonly aria-label="Quantity">'+
          '<button onclick="TC.cQty(\''+it.key+'\','+(it.qty+1)+')" aria-label="Increase">+</button></div>'+
        '</div>'+
        '<div class="right"><span class="line-total">'+TC.money(p.price*it.qty)+'</span>'+
          '<button class="rm-btn" onclick="TC.cRemove(\''+it.key+'\')">'+TC.t('btn.remove')+'</button></div>'+
      '</div>';
    }).join('');

    var sub = TC.cart.subtotal();
    var disc = TC.coupon.discount(sub);
    var deliv = TC.deliveryCharge(sub, '');
    var total = Math.max(0, sub - disc + deliv);
    var cp = TC.coupon.get();

    root.innerHTML = '<div class="cart-layout">'+
      '<div class="cart-list">'+rows+'</div>'+
      '<aside class="summary">'+
        '<h3>'+TC.t('cart.summary')+'</h3>'+
        '<div class="sum-row"><span>'+TC.t('cart.subtotal')+'</span><b>'+TC.money(sub)+'</b></div>'+
        (disc>0?'<div class="sum-row" style="color:var(--success)"><span>'+TC.t('cart.discount')+'</span><b>−'+TC.money(disc)+'</b></div>':'')+
        '<div class="sum-row"><span>'+TC.t('cart.delivery')+'</span><b>'+(deliv===0?TC.t('cart.free'):TC.money(deliv))+'</b></div>'+
        '<div class="sum-row total"><span>'+TC.t('cart.total')+'</span><span>'+TC.money(total)+'</span></div>'+
        '<div class="coupon-row"><input id="cp-input" placeholder="'+TC.t('cart.couponPh')+'" value="'+(cp?cp.code:'')+'" aria-label="Coupon">'+
          '<button class="btn btn-ghost btn-sm" onclick="TC.cCoupon()">'+TC.t('btn.apply')+'</button></div>'+
        '<div class="coupon-msg" id="cp-msg"></div>'+
        '<a class="btn btn-primary btn-block" href="checkout.html" style="margin-top:8px">'+TC.t('btn.checkout')+'</a>'+
        '<a class="btn btn-ghost btn-block" href="shop.html" style="margin-top:10px">'+TC.t('btn.continue')+'</a>'+
        '<p style="font-size:12px;color:var(--text-3);margin:16px 0 0;line-height:1.6">'+TC.money(D.delivery.freeAbove)+'+ অর্ডারে ফ্রি ডেলিভারি। চূড়ান্ত দাম চেকআউটে সার্ভার-সাইডে যাচাই করা হয়।</p>'+
      '</aside>'+
    '</div>';
  }

  TC.cQty = function(key, q){ TC.cart.setQty(key, q); render(); };
  TC.cRemove = function(key){ TC.cart.remove(key); render(); };
  TC.cCoupon = function(){
    var code = (TC.byId('cp-input').value||'').trim();
    var msg = TC.byId('cp-msg');
    if (!code){ TC.coupon.clear(); render(); return; }
    var c = TC.coupon.find(code);
    if (!c){ msg.className='coupon-msg err'; msg.textContent=TC.t('toast.couponErr'); return; }
    var sub = TC.cart.subtotal();
    if (sub < (c.min||0)){ msg.className='coupon-msg err'; msg.textContent='সর্বনিম্ন '+TC.money(c.min)+' অর্ডারে প্রযোজ্য'; return; }
    TC.coupon.set(c);
    TC.toast(TC.t('toast.couponOk'),'ok');
    render();
  };

  document.addEventListener('tc:lang', render);
  TC.boot('cart');
  render();
})();
</script>
</body>
</html>
