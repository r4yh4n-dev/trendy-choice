function announcePaused(el){try{el.dispatchEvent(new Event("pause"))}catch(e){}}
function harden(el){
el.autoplay=false;el.removeAttribute("autoplay");
if(el.getAttribute("preload")==="auto"){el.setAttribute("preload","none")}

<script>
/* =========================================================================
   Trendy Choice — product detail
   ?id=<product id>  →  /api/product/:id  থেকে ডিটেইল
   ?slug=<...>       →  /api/products তালিকা থেকে মিলিয়ে নেয়
   কিছু না থাকলে      →  প্রথম প্রোডাক্ট দেখায়
   ========================================================================= */
(function () {
  'use strict';

  var API = 'https://trendy-choice-api.r4yh4nxyz.workers.dev';
  var D = window.TC_DATA;

  var PLACEHOLDER = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">' +
    '<rect width="600" height="600" fill="#1b1b26"/>' +
    '<g fill="none" stroke="#3a3a4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="196" y="196" width="208" height="156" rx="16"/>' +
    '<circle cx="248" cy="242" r="17"/>' +
    '<path d="M206 340l62-62 46 46 36-31 44 47"/></g>' +
    '<text x="300" y="424" fill="#6f6f85" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="middle">No image</text>' +
    '</svg>'
  );

  var sel = { variant: {}, qty: 1, img: 0 };
  var p = null;                 /* বর্তমান প্রোডাক্ট */
  var all = [];                 /* related দেখানোর জন্য তালিকা */
  var requestedId = TC.qs('id') || '';
  var requestedSlug = TC.qs('slug') || '';

  /* ---------------- helpers ---------------- */
  function pick(o, lang) {
    if (!o) return '';
    if (typeof o === 'string') return o;
    return o[lang] || o.bn || o.en || '';
  }
  function safeImg(u) {
    return (typeof u === 'string' && /^(https?:|data:|images\/)/.test(u)) ? u : PLACEHOLDER;
  }
  function slugify(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]+/g, '-').replace(/^-|-$/g, '');
  }

  function normalize(x, i) {
    var name = x.name || {}, desc = x.desc || {};
    var gallery = (Array.isArray(x.gallery) ? x.gallery : []).filter(Boolean);
    var img = x.img || gallery[0] || '';
    if (!gallery.length && img) gallery = [img];
    return {
      id: x.id || x.spid || ('api-' + i),
      cat: x.cat || 'other',
      catName: x.catName || null,
      supplier: x.supplier || 'unknown',
      supplierName: x.supplierName || x.supplier || 'Supplier',
      spid: x.spid || x.id || '',
      name: { bn: name.bn || name.en || 'প্রোডাক্ট', en: name.en || name.bn || 'Product' },
      desc: { bn: desc.bn || desc.en || '', en: desc.en || desc.bn || '' },
      price: Number(x.price) || 0,
      oldPrice: Number(x.oldPrice) || 0,
      stock: x.stock == null ? 0 : Number(x.stock),
      rating: Number(x.rating) || 0,
      reviews: Number(x.reviews) || 0,
      img: safeImg(img),
      gallery: gallery.length ? gallery.map(safeImg) : [safeImg(img)],
      variants: (x.variants && typeof x.variants === 'object') ? x.variants : {},
      badges: Array.isArray(x.badges) ? x.badges.slice() : [],
      featured: !!x.featured, trending: !!x.trending,
      bestseller: !!x.bestseller, isNew: !!x.isNew,
      specs: Array.isArray(x.specs) ? x.specs : [],
      sources: Array.isArray(x.sources) ? x.sources : (x.supplier ? [x.supplier] : [])
    };
  }

  function setStatus(kind, html) {
    var host = TC.byId('tc-api-status');
    if (!host) return;
    if (!kind) { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="tc-status ' + (kind === 'ok' ? '' : kind) + '"><span class="dot"></span><span>' + html + '</span></div>';
    var btn = host.querySelector('.tc-btn');
    if (btn) btn.addEventListener('click', function () { boot(true); });
  }

  function skeleton() {
    TC.byId('pd-root').innerHTML =
      '<div class="pd-skel"><div class="sk sk-img"></div><div>' +
      '<div class="sk sk-line" style="width:35%"></div>' +
      '<div class="sk sk-line" style="width:85%;height:26px"></div>' +
      '<div class="sk sk-line" style="width:55%"></div>' +
      '<div class="sk sk-line" style="width:40%;height:22px"></div>' +
      '<div class="sk sk-line" style="width:100%"></div>' +
      '<div class="sk sk-line" style="width:92%"></div>' +
      '<div class="sk sk-line" style="width:70%"></div></div></div>';
  }

  function getJSON(url) {
    return fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  /* ---------------- রেন্ডার (আগের ডিজাইন হুবহু) ---------------- */
  function variantLabel(k) {
    var map = { color: 'pd.color', size: 'pd.size', switch: 'pd.switch', shade: 'pd.shade' };
    return TC.t(map[k] || k);
  }

  function render() {
    if (!p) return;
    var off = TC.discount(p);
    var stockCls = p.stock <= 0 ? 'out' : (p.stock <= 20 ? 'low' : 'in');
    var stockTxt = p.stock <= 0 ? TC.t('pd.outStock')
      : (p.stock <= 20 ? TC.t('pd.lowStock') + ' (' + p.stock + ')' : TC.t('pd.inStock'));

    /* variants */
    var vHtml = '';
    Object.keys(p.variants || {}).forEach(function (k) {
      var opts = p.variants[k];
      if (!Array.isArray(opts) || !opts.length) return;
      if (!sel.variant[k] || opts.indexOf(sel.variant[k]) < 0) sel.variant[k] = opts[0];
      vHtml += '<div class="opt-block"><h4>' + variantLabel(k) + '</h4><div class="opt-row" data-vk="' + TC.esc(k) + '">' +
        opts.map(function (o) {
          return '<button class="opt' + (sel.variant[k] === o ? ' active' : '') + '" data-vv="' + TC.esc(o) + '">' + TC.esc(o) + '</button>';
        }).join('') + '</div></div>';
    });

    var gallery = (p.gallery && p.gallery.length) ? p.gallery : [p.img];
    if (sel.img >= gallery.length) sel.img = 0;
    var thumbs = gallery.map(function (g, i) {
      return '<div class="pd-thumb' + (i === sel.img ? ' active' : '') + '" data-th="' + i + '">' +
        '<img src="' + safeImg(g) + '" alt="' + TC.esc(pick(p.name, TC.lang)) + ' ' + (i + 1) + '" loading="lazy" width="200" height="200" onerror="this.src=\'' + PLACEHOLDER + '\'"></div>';
    }).join('');

    var specs = (p.specs || []).map(function (s) {
      return '<tr><td>' + TC.esc(s[0]) + '</td><td>' + TC.esc(s[1]) + '</td></tr>';
    }).join('');
    if (!specs) {
      specs = '<tr><td>' + TC.t('pd.specs') + '</td><td>—</td></tr>';
    }

    /* related: একই ক্যাটাগরি আগে, তারপর বাকিরা */
    var related = all.filter(function (x) { return x.cat === p.cat && x.id !== p.id; }).slice(0, 4);
    if (related.length < 4) {
      all.forEach(function (x) {
        if (related.length >= 4) return;
        if (x.id !== p.id && !related.some(function (r) { return r.id === x.id; })) related.push(x);
      });
    }

    var revs = (D.reviews || []).map(function (r) {
      return '<div class="rev-item"><span class="stars">' + TC.stars(r.rating) + '</span>' +
        '<p style="margin:8px 0 10px;color:var(--text-2);font-size:14px">“' + TC.esc(pick(r.text, TC.lang)) + '”</p>' +
        '<div class="rev-who"><span class="rev-av">' + TC.esc(String(r.name || '?').charAt(0)) + '</span>' +
        '<div><b>' + TC.esc(r.name) + '</b><span>' + TC.esc(r.city) + '</span></div></div></div>';
    }).join('');

    var catLabel = p.catName ? pick(p.catName, TC.lang) : TC.catName(p.cat);
    var supLabel = p.supplierName || TC.supplierName(p.supplier);

    TC.byId('crumb-name').textContent = pick(p.name, TC.lang);
    document.title = pick(p.name, TC.lang) + ' — Trendy Choice';

    TC.byId('pd-root').innerHTML = '' +
    '<div class="pd-layout">' +
      '<div class="pd-gallery">' +
        '<div class="pd-main"><img id="pd-main-img" src="' + safeImg(gallery[sel.img]) + '" alt="' + TC.esc(pick(p.name, TC.lang)) + '" width="800" height="800" onerror="this.src=\'' + PLACEHOLDER + '\'"></div>' +
        '<div class="pd-thumbs">' + thumbs + '</div>' +
      '</div>' +
      '<div class="pd-info">' +
        '<div class="prod-src" style="margin-bottom:8px">' + TC.esc(supLabel) + ' · ' + TC.esc(p.spid || p.id) + '</div>' +
        '<h1>' + TC.esc(pick(p.name, TC.lang)) + '</h1>' +
        '<div class="pd-meta">' +
          '<span><span class="stars">' + TC.stars(p.rating) + '</span> ' + p.rating + ' (' + p.reviews + ' ' + TC.t('pd.reviews') + ')</span>' +
          '<span>' + TC.esc(catLabel) + '</span>' +
        '</div>' +
        '<div class="pd-price"><span class="price-now">' + TC.money(p.price) + '</span>' +
          (p.oldPrice > p.price ? '<span class="price-old">' + TC.money(p.oldPrice) + '</span>' : '') +
          (off > 0 ? '<span class="price-off">-' + off + '%</span>' : '') + '</div>' +
        '<div class="pd-stock ' + stockCls + '">' + stockTxt + '</div>' +
        '<p class="pd-desc">' + TC.esc(pick(p.desc, TC.lang)) + '</p>' +
        vHtml +
        '<div class="opt-block"><h4>' + TC.t('pd.qty') + '</h4>' +
          '<div class="qty"><button onclick="TC.pdQty(-1)" aria-label="Decrease">−</button>' +
          '<input id="pd-qty" type="text" value="' + sel.qty + '" readonly aria-label="Quantity">' +
          '<button onclick="TC.pdQty(1)" aria-label="Increase">+</button></div></div>' +
        '<div class="pd-actions">' +
          '<button class="btn btn-primary" onclick="TC.pdAdd(false)"' + (p.stock <= 0 ? ' disabled' : '') + '>' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>' +
            TC.t('btn.addCart') + '</button>' +
          '<button class="btn btn-outline" onclick="TC.pdAdd(true)"' + (p.stock <= 0 ? ' disabled' : '') + '>' + TC.t('btn.buyNow') + '</button>' +
          '<button class="btn btn-ghost" style="flex:0 0 auto;min-width:auto;padding:0 16px" onclick="TC.pdWish()" aria-label="Wishlist">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 000-7.8z"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="pd-perks">' +
          '<div class="perk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
            '<div><b>' + TC.t('pd.delivIn') + ': ' + TC.money(D.delivery.insideDhaka) + '</b><span>' + TC.t('pd.delivOut') + ': ' + TC.money(D.delivery.outsideDhaka) + '</span></div></div>' +
          '<div class="perk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
            '<div><b>' + TC.t('pd.delivTime') + '</b><span>' + TC.t('pd.delivTimeV') + '</span></div></div>' +
          '<div class="perk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v6h6"/></svg>' +
            '<div><b>' + TC.t('pd.return') + '</b><span>' + TC.t('pd.returnV') + '</span></div></div>' +
          '<div class="perk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>' +
            '<div><b>' + TC.t('pd.genuine') + '</b><span>' + TC.t('pd.genuineV') + '</span></div></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="tabs">' +
      '<div class="tab-nav">' +
        '<button class="active" data-tab="desc">' + TC.t('pd.desc') + '</button>' +
        '<button data-tab="specs">' + TC.t('pd.specs') + '</button>' +
        '<button data-tab="revs">' + TC.t('pd.reviews') + ' (' + p.reviews + ')</button>' +
        '<button data-tab="deliv">' + TC.t('pd.delivery') + '</button>' +
      '</div>' +
      '<div class="tab-panel active" data-panel="desc"><p style="color:var(--text-2);line-height:1.8;max-width:820px">' + TC.esc(pick(p.desc, TC.lang)) + '</p></div>' +
      '<div class="tab-panel" data-panel="specs"><table class="spec-table">' + specs + '</table></div>' +
      '<div class="tab-panel" data-panel="revs"><div class="rev-list">' + revs + '</div></div>' +
      '<div class="tab-panel" data-panel="deliv"><div class="prose" style="max-width:820px">' +
        '<p><b>' + TC.t('pd.delivIn') + ':</b> ' + TC.money(D.delivery.insideDhaka) + ' · <b>' + TC.t('pd.delivOut') + ':</b> ' + TC.money(D.delivery.outsideDhaka) + '</p>' +
        '<p>' + TC.money(D.delivery.freeAbove) + '+ অর্ডারে সারা দেশে ফ্রি ডেলিভারি। ' + TC.t('pd.delivTimeV') + '।</p>' +
        '<p>' + TC.t('pd.returnV') + '। প্রোডাক্টে সমস্যা থাকলে ডেলিভারির ৭ দিনের মধ্যে রিটার্ন বা এক্সচেঞ্জ করা যাবে।</p>' +
        '<p>বিভিন্ন সাপ্লায়ার থেকে আসা প্রোডাক্ট আলাদা শিপমেন্টে পৌঁছাতে পারে।</p>' +
      '</div></div>' +
    '</div>' +

    '<section class="section"><div class="section-head"><div><span class="eyebrow">You may also like</span><h2>' + TC.t('pd.related') + '</h2></div></div>' +
      '<div class="prod-grid" id="pd-related"></div></section>';

    TC.renderGrid(TC.byId('pd-related'), related);

    /* gallery */
    TC.byId('pd-root').querySelectorAll('.pd-thumb').forEach(function (t) {
      t.addEventListener('click', function () {
        sel.img = +t.getAttribute('data-th');
        TC.byId('pd-main-img').src = safeImg(gallery[sel.img]);
        TC.byId('pd-root').querySelectorAll('.pd-thumb').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
      });
    });
    /* variants */
    TC.byId('pd-root').querySelectorAll('.opt-row').forEach(function (row) {
      row.querySelectorAll('.opt').forEach(function (b) {
        b.addEventListener('click', function () {
          var k = row.getAttribute('data-vk');
          sel.variant[k] = b.getAttribute('data-vv');
          row.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
    });
    /* tabs */
    TC.byId('pd-root').querySelectorAll('.tab-nav button').forEach(function (b) {
      b.addEventListener('click', function () {
        var t = b.getAttribute('data-tab');
        TC.byId('pd-root').querySelectorAll('.tab-nav button').forEach(function (x) { x.classList.remove('active'); });
        TC.byId('pd-root').querySelectorAll('.tab-panel').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        var panel = TC.byId('pd-root').querySelector('.tab-panel[data-panel="' + t + '"]');
        if (panel) panel.classList.add('active');
      });
    });
  }

  /* ---------------- cart / wish hooks ---------------- */
  TC.pdQty = function (d) {
    if (!p) return;
    var max = p.stock > 0 ? p.stock : 99;
    sel.qty = Math.max(1, Math.min(max, sel.qty + d));
    var el = TC.byId('pd-qty');
    if (el) el.value = sel.qty;
  };
  TC.pdVariantStr = function () {
    return Object.keys(sel.variant).map(function (k) { return k + ':' + sel.variant[k]; }).join(', ');
  };
  TC.pdAdd = function (buyNow) {
    if (!p) return;
    if (p.stock <= 0) { TC.toast(TC.t('toast.outStock'), 'err'); return; }
    TC.cart.add(p.id, sel.qty, TC.pdVariantStr());
    if (buyNow) location.href = 'checkout.html';
  };
  TC.pdWish = function () { if (p) TC.wish.toggle(p.id); };

  /* ---------------- ডেটা লোড ---------------- */
  function findInList(list) {
    if (requestedId) {
      var byId = list.filter(function (x) { return x.id === requestedId || x.spid === requestedId; })[0];
      if (byId) return byId;
    }
    if (requestedSlug) {
      var s = requestedSlug.toLowerCase();
      var bySlug = list.filter(function (x) {
        return slugify(pick(x.name, 'en')) === s || slugify(pick(x.name, 'bn')) === s || x.id === requestedSlug;
      })[0];
      if (bySlug) return bySlug;
    }
    return null;
  }

  function boot(force) {
    skeleton();
    setStatus('', '');

    var detailUrl = requestedId
      ? API + '/api/product/' + encodeURIComponent(requestedId)
      : null;

    var detailPromise = detailUrl
      ? getJSON(detailUrl).then(function (d) {
          if (!d || !d.product) throw new Error('not found');
          return d.product;
        }).catch(function () { return null; })   /* ডিটেইল endpoint ফেল করলে তালিকা থেকে খুঁজি */
      : Promise.resolve(null);

    var listPromise = getJSON(API + '/api/products' + (force ? '?refresh=1' : ''))
      .then(function (d) { return (d && d.products) || []; })
      .catch(function () { return null; });

    Promise.all([detailPromise, listPromise]).then(function (res) {
      var detail = res[0];
      var rawList = res[1];

      /* তালিকা না পেলে লোকাল data.js */
      var list = rawList && rawList.length
        ? rawList.map(normalize)
        : (D.products || []).map(normalize);

      all = list;

      var chosen = detail ? normalize(detail, 0) : findInList(list);
      var notFound = false;

      if (!chosen) {
        /* কিছু না মিললে প্রথম প্রোডাক্ট */
        chosen = list[0];
        notFound = !!chosen;
        if (chosen) {
          setStatus('warn', '<b>“' + TC.esc(requestedId || requestedSlug) + '” খুঁজে পাওয়া যায়নি</b> — ' +
            'প্রথম প্রোডাক্টটি দেখানো হচ্ছে। <a href="shop.html" style="color:inherit;text-decoration:underline">সব প্রোডাক্ট দেখুন</a>');
        }
      }

      if (!chosen) {
        TC.byId('pd-root').innerHTML = '<p style="padding:40px 0;color:var(--text-2)">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
        setStatus('err', '<b>প্রোডাক্ট লোড হয়নি</b> — API বা ইন্টারনেট সংযোগ ঠিক নেই।' +
          '<button class="tc-btn" type="button">আবার চেষ্টা</button>');
        return;
      }

      p = chosen;
      sel = { variant: {}, qty: 1, img: 0 };

      /* সাইটের বাকি অংশ (কার্ট, wishlist, related) TC_DATA পড়ে — সেটাও আপডেট করি */
      D.products = list;
      if (rawList && rawList.length) {
        D.suppliers = D.suppliers || {};
        list.forEach(function (x) {
          if (x.supplier && !D.suppliers[x.supplier]) D.suppliers[x.supplier] = { name: x.supplierName, site: '' };
        });
      }

      render();

      if (!rawList) {
        setStatus('err', '<b>লাইভ API-তে পৌঁছানো যায়নি</b> — লোকাল ডেটা দেখানো হচ্ছে।' +
          '<button class="tc-btn" type="button">আবার চেষ্টা</button>');
      } else if (notFound) {
        /* উপরের "খুঁজে পাওয়া যায়নি" বার্তাটাই থাক */
      } else if (!detail && requestedId) {
        setStatus('warn', '<b>ডিটেইল endpoint পাওয়া যায়নি</b> — তালিকা থেকে তথ্য দেখানো হচ্ছে।');
      } else {
        setStatus('ok', '<b>' + TC.esc(pick(p.name, TC.lang)) + '</b> · লাইভ API থেকে লোড হয়েছে');
      }
    }).catch(function (err) {
      setStatus('err', '<b>কিছু ভুল হয়েছে</b> (' + TC.esc(err.message) + ')' +
        '<button class="tc-btn" type="button">আবার চেষ্টা</button>');
    });
  }

  document.addEventListener('tc:lang', function () { if (p) render(); });

  TC.boot('shop');
  boot(false);
})();
</script>
</body>
</html>
