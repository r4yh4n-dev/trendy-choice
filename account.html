<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — Trendy Choice</title>
<meta name="description" content="Trendy Choice অ্যাকাউন্ট — লগইন, রেজিস্ট্রেশন, অর্ডার হিস্ট্রি, উইশলিস্ট, প্রোফাইল ও ঠিকানা বই।">
<meta name="theme-color" content="#0a0a0f">
<link rel="canonical" href="account.html">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c5cff'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>TC</text></svg>">
</head>
<body>
<div id="tc-header"></div>

<main>
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home">হোম</a><span>/</span><span data-i18n="acct.title">আমার অ্যাকাউন্ট</span></div>
    <div class="page-head"><h1 data-i18n="acct.title">আমার অ্যাকাউন্ট</h1></div>
  </div>
  <div class="wrap" id="acct-root"></div>
</main>

<div id="tc-footer"></div>

<script src="data.js"></script>
<script src="app.js?v=3"></script>
<script>
(function(){
  var D = window.TC_DATA;
  var user = null;
  try { user = JSON.parse(localStorage.getItem('tc-user')); } catch(e){}
  var tab = (location.hash || '#orders').replace('#','');

  function render(){
    var root = TC.byId('acct-root');
    if (!user){ root.innerHTML = authView(); wireAuth(); return; }
    root.innerHTML = panelView(); wirePanel();
  }

  /* ---------- auth ---------- */
  function authView(){
    return '<div class="auth-card">'+
      '<h2 id="auth-title">'+TC.t('acct.login')+'</h2>'+
      '<p id="auth-sub">আপনার অ্যাকাউন্টে লগইন করুন</p>'+
      '<form id="auth-form">'+
        '<div class="field" id="f-name" style="display:none;margin-bottom:14px"><label>'+TC.t('co.name')+'</label><input name="name" autocomplete="name"></div>'+
        '<div class="field" style="margin-bottom:14px"><label>'+TC.t('co.phone')+' / Email</label><input name="ident" required autocomplete="username"></div>'+
        '<div class="field" style="margin-bottom:18px"><label>'+TC.t('acct.password')+'</label><input name="pass" type="password" required autocomplete="current-password"></div>'+
        '<button class="btn btn-primary btn-block" type="submit" id="auth-btn">'+TC.t('acct.login')+'</button>'+
      '</form>'+
      '<div class="auth-switch"><span id="auth-switch-txt">নতুন গ্রাহক?</span> <button id="auth-toggle">'+TC.t('acct.register')+'</button></div>'+
      '<p style="font-size:12px;color:var(--text-3);margin:18px 0 0;line-height:1.6">ডেমো অ্যাকাউন্ট — তথ্য শুধু এই ব্রাউজারে সংরক্ষিত হয়। প্রোডাকশনে অথেন্টিকেশন Cloudflare Worker-এ সুরক্ষিতভাবে পরিচালিত হবে।</p>'+
    '</div>';
  }

  function wireAuth(){
    var mode = 'login';
    var form = TC.byId('auth-form');
    TC.byId('auth-toggle').addEventListener('click', function(){
      mode = mode === 'login' ? 'register' : 'login';
      var isReg = mode === 'register';
      TC.byId('auth-title').textContent = isReg ? TC.t('acct.register') : TC.t('acct.login');
      TC.byId('auth-sub').textContent = isReg ? 'নতুন অ্যাকাউন্ট তৈরি করুন' : 'আপনার অ্যাকাউন্টে লগইন করুন';
      TC.byId('auth-btn').textContent = isReg ? TC.t('acct.register') : TC.t('acct.login');
      TC.byId('f-name').style.display = isReg ? 'block' : 'none';
      TC.byId('auth-switch-txt').textContent = isReg ? 'আগে থেকেই অ্যাকাউন্ট আছে?' : 'নতুন গ্রাহক?';
      TC.byId('auth-toggle').textContent = isReg ? TC.t('acct.login') : TC.t('acct.register');
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var ident = form.ident.value.trim();
      if (!ident || !form.pass.value){ TC.toast('সব তথ্য পূরণ করুন','err'); return; }
      user = { name: (form.name && form.name.value.trim()) || ident.split('@')[0], ident: ident };
      localStorage.setItem('tc-user', JSON.stringify(user));
      TC.toast(mode==='register' ? TC.t('toast.regOk') : TC.t('toast.loginOk'), 'ok');
      render();
    });
  }

  /* ---------- panel ---------- */
  function panelView(){
    var orders = [];
    try { orders = JSON.parse(localStorage.getItem('tc-orders')) || []; } catch(e){}
    var wish = TC.wish.get().map(TC.product).filter(Boolean);

    var ordersHtml = orders.length ? orders.map(function(o){
      var st = 'st-pending', label = 'Pending';
      return '<div class="order-card"><div class="oc-head"><div><b>'+TC.esc(o.id)+'</b><br><span>'+new Date(o.date).toLocaleDateString('en-GB')+' · '+o.items.length+' items</span></div>'+
        '<div style="text-align:right"><span class="status-pill '+st+'">'+label+'</span><br><b style="font-size:15px">'+TC.money(o.total)+'</b></div></div>'+
        '<div style="font-size:13px;color:var(--text-2)">'+o.items.map(function(i){ return TC.esc(i.name)+' ×'+i.qty; }).join(', ')+'</div></div>';
    }).join('') : '<div class="empty"><h3>'+TC.t('acct.noOrders')+'</h3><p>'+TC.t('cart.emptySub')+'</p><a class="btn btn-primary" href="shop.html">'+TC.t('btn.continue')+'</a></div>';

    var wishHtml = wish.length ? '<div class="prod-grid cols-3" id="wish-grid"></div>' :
      '<div class="empty"><h3>'+TC.t('acct.noWish')+'</h3><p>পছন্দের প্রোডাক্টে ♡ আইকনে ক্লিক করে উইশলিস্টে যোগ করুন।</p><a class="btn btn-primary" href="shop.html">'+TC.t('btn.continue')+'</a></div>';

    return '<div class="acct-layout">'+
      '<aside class="acct-nav">'+
        '<button data-t="orders" class="'+(tab==='orders'?'active':'')+'">'+TC.t('acct.orders')+'</button>'+
        '<button data-t="wishlist" class="'+(tab==='wishlist'?'active':'')+'">'+TC.t('acct.wishlist')+'</button>'+
        '<button data-t="profile" class="'+(tab==='profile'?'active':'')+'">'+TC.t('acct.profile')+'</button>'+
        '<button data-t="address" class="'+(tab==='address'?'active':'')+'">'+TC.t('acct.address')+'</button>'+
        '<button data-t="password" class="'+(tab==='password'?'active':'')+'">'+TC.t('acct.password')+'</button>'+
        '<button data-t="logout" style="color:var(--danger)">'+TC.t('acct.logout')+'</button>'+
      '</aside>'+
      '<div>'+
        '<div class="acct-panel '+(tab==='orders'?'active':'')+'" data-p="orders">'+ordersHtml+'</div>'+
        '<div class="acct-panel '+(tab==='wishlist'?'active':'')+'" data-p="wishlist">'+wishHtml+'</div>'+
        '<div class="acct-panel '+(tab==='profile'?'active':'')+'" data-p="profile">'+
          '<div class="co-card"><h3>'+TC.t('acct.profile')+'</h3><div class="form-grid">'+
            '<div class="field"><label>'+TC.t('co.name')+'</label><input value="'+TC.esc(user.name)+'"></div>'+
            '<div class="field"><label>'+TC.t('co.phone')+' / Email</label><input value="'+TC.esc(user.ident)+'"></div>'+
          '</div><button class="btn btn-primary" style="margin-top:16px" onclick="TC.toast(\'প্রোফাইল সংরক্ষিত\',\'ok\')">সংরক্ষণ করুন</button></div>'+
        '</div>'+
        '<div class="acct-panel '+(tab==='address'?'active':'')+'" data-p="address">'+
          '<div class="co-card"><h3>'+TC.t('acct.address')+'</h3><p style="color:var(--text-2);font-size:14px">চেকআউটে ব্যবহৃত ঠিকানা এখানে সংরক্ষিত থাকবে।</p>'+
          '<button class="btn btn-ghost" onclick="TC.toast(\'নতুন ঠিকানা যোগ করুন\',\'ok\')">+ নতুন ঠিকানা</button></div>'+
        '</div>'+
        '<div class="acct-panel '+(tab==='password'?'active':'')+'" data-p="password">'+
          '<div class="co-card"><h3>'+TC.t('acct.password')+'</h3><div class="form-grid">'+
            '<div class="field full"><label>বর্তমান পাসওয়ার্ড</label><input type="password"></div>'+
            '<div class="field"><label>নতুন পাসওয়ার্ড</label><input type="password"></div>'+
            '<div class="field"><label>নিশ্চিত করুন</label><input type="password"></div>'+
          '</div><button class="btn btn-primary" style="margin-top:16px" onclick="TC.toast(\'পাসওয়ার্ড পরিবর্তিত\',\'ok\')">আপডেট করুন</button></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function wirePanel(){
    var wg = TC.byId('wish-grid');
    if (wg) TC.renderGrid(wg, TC.wish.get().map(TC.product).filter(Boolean));

    TC.byId('acct-root').querySelectorAll('.acct-nav button').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-t');
        if (t === 'logout'){
          localStorage.removeItem('tc-user'); user = null; TC.toast('লগআউট হয়েছে','ok'); render(); return;
        }
        tab = t;
        TC.byId('acct-root').querySelectorAll('.acct-nav button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        TC.byId('acct-root').querySelectorAll('.acct-panel').forEach(function(x){ x.classList.remove('active'); });
        var panel = TC.byId('acct-root').querySelector('.acct-panel[data-p="'+t+'"]');
        if (panel) panel.classList.add('active');
      });
    });
  }

  document.addEventListener('tc:lang', render);
  TC.boot('');
  render();
})();
</script>
</body>
</html>
