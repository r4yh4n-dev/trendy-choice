<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D4ED8">
<title>Trendy Choice — অ্যাডমিন</title>
<style>
:root{
  --ink:#0F2A4A; --muted:#5B6B82; --blue:#1D4ED8; --blue-d:#173FAE; --blue-50:#EEF3FF;
  --line:#D8E1EE; --bg:#F5F8FC; --card:#FFFFFF; --red:#B42318; --green:#15803D; --green-50:#E8F5EC; --red-50:#FDECEA;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Hind Siliguri",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #93B4FF;outline-offset:2px}
[hidden]{display:none!important}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#F0C4BF}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}

input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{resize:vertical;min-height:84px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}

/* লগইন */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{font-size:20px;margin:0 0 4px}
.login p{margin:0 0 8px;color:var(--muted);font-size:14px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:10px 0 0}

/* অ্যাপ */
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:17px;margin:0;flex:1}
header .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:6px}
.bar input{flex:1}
.count{color:var(--muted);font-size:14px;margin:8px 2px 10px}

.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.thumb{width:60px;height:60px;border-radius:10px;background:var(--blue-50);object-fit:cover;flex:none}
.info{flex:1;min-width:0}
.name{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.price{color:var(--muted);font-size:14px;margin-top:2px}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.tag{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;margin-left:6px;background:var(--blue-50);color:var(--blue)}
.tag.off{background:var(--red-50);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* এডিটর */
dialog{border:0;padding:0;width:min(560px,100%);max-height:100vh;border-radius:16px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,42,74,.5)}
dialog form{display:flex;flex-direction:column;max-height:100vh}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.db{padding:0 16px 16px;overflow:auto}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.df #resetBtn{margin-right:auto}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.toast.bad{background:var(--red)}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <h1>Trendy Choice অ্যাডমিন</h1>
    <p>পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
    <label for="pw" style="margin-top:12px">পাসওয়ার্ড</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" style="width:100%;margin-top:6px" id="loginBtn">প্রবেশ করুন</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>পণ্য তালিকা</h1>
    <a class="btn sm" id="liveLink" target="_blank" rel="noopener">লাইভ সাইট</a>
    <button class="btn sm" id="logout" type="button">বের হোন</button>
  </header>
  <main>
    <div class="bar">
      <input id="q" type="search" placeholder="পণ্য খুঁজুন" aria-label="পণ্য খুঁজুন">
          </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dh" id="dlgTitle"></div>
    <div class="db">
      <label for="fName">নাম</label>
      <input id="fName" required maxlength="200">
      <label for="fPrice">দাম (৳)</label>
      <input id="fPrice" type="number" min="0" step="1" inputmode="numeric" required>
      <p class="hint" id="priceHint"></p>
      <label for="fDesc">বর্ণনা</label>
      <textarea id="fDesc"></textarea>
      <label for="fImages">ছবির লিংক</label>
      <textarea id="fImages" placeholder="প্রতি লাইনে একটি লিংক"></textarea>
      <p class="hint">প্রথম লিংকটি মূল ছবি হবে।</p>
      <p class="hint">স্টক, রং ও সাইজ Business Koro থেকে আসে, এখানে বদলানো যায় না।</p>
      <p class="err" id="formErr" role="alert"></p>
    </div>
    <div class="df">
      <button class="btn danger" type="button" id="resetBtn">মূল মান ফেরান</button>
      <button class="btn" type="button" id="cancel">বাতিল</button>
      <button class="btn primary" id="save">সেভ করুন</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  var API  = 'https://trendy-choice-api.r4yh4nxyz.workers.dev';
  var SITE = 'https://r4yh4n-dev.github.io/trendy-choice/';
  var KEY  = 'tc_admin_pw';

  var $ = function (id) { return document.getElementById(id); };
  var token = '', products = [], editing = null;

  function store(get, val) {
    try { if (get) return localStorage.getItem(KEY) || ''; if (val) localStorage.setItem(KEY, val); else localStorage.removeItem(KEY); } catch (e) {}
    return '';
  }
  var bn = function (n) { return Number(n || 0).toLocaleString('bn-BD'); };

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') e.textContent = props[k]; else if (k === 'class') e.className = props[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), props[k]); else e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  var toastTimer;
  function toast(msg, bad) {
    var t = $('toast'); if (t) t.remove();
    t = el('div', { id: 'toast', class: 'toast' + (bad ? ' bad' : ''), role: 'status', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 3200);
  }

  function request(method, path, body, auth) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 25000);
    var headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (auth) headers['Authorization'] = 'Bearer ' + auth;
    return fetch(API + path, { method: method, headers: headers, signal: ctl.signal, cache: 'no-store',
      body: body !== undefined ? JSON.stringify(body) : undefined })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) { var err = new Error(d.message || 'সমস্যা হয়েছে'); err.status = r.status; throw err; }
          return d;
        });
      })
      .catch(function (e) {
        if (e.status) throw e;
        var err = new Error('সংযোগ হয়নি — ইন্টারনেট দেখে আবার চেষ্টা করুন'); err.status = 0; throw err;
      })
      .finally(function () { clearTimeout(timer); });
  }

  /* ── লগইন ── */
  function showLogin(msg) {
    $('app').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || ''; $('pw').value = ''; $('pw').focus();
  }
  function showApp() {
    $('login').hidden = true; $('app').hidden = false;
    $('liveLink').href = SITE;
    loadProducts();
  }
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = $('pw').value.trim(); if (!pw) return;
    $('loginBtn').disabled = true; $('loginErr').textContent = '';
    request('POST', '/admin/auth', {}, pw).then(function () {
      token = pw; store(false, pw); showApp();
    }).catch(function (e) {
      $('loginErr').textContent = e.status === 401 ? 'পাসওয়ার্ড ভুল' : e.message;
    }).finally(function () { $('loginBtn').disabled = false; });
  });
  $('logout').addEventListener('click', function () { token = ''; store(false, ''); showLogin(); });

  function onAuthFail(e) {
    if (e.status === 401) { token = ''; store(false, ''); showLogin('পাসওয়ার্ড বদলে গেছে, আবার প্রবেশ করুন'); return true; }
    return false;
  }

  /* ── তালিকা ── */
  function loadProducts() {
    $('count').textContent = 'লোড হচ্ছে…';
    request('GET', '/admin/products', undefined, token).then(function (d) {
      products = Array.isArray(d.products) ? d.products : [];
      render();
    }).catch(function (e) {
      if (onAuthFail(e)) return;
      $('count').textContent = '';
      $('list').replaceChildren(el('div', { class: 'empty' }, [
        el('p', { text: e.message }),
        el('button', { class: 'btn', type: 'button', text: 'আবার চেষ্টা করুন', onclick: loadProducts })
      ]));
    });
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var shown = products.filter(function (p) { return !q || String(p.name).toLowerCase().indexOf(q) > -1; });
    var hiddenCount = products.filter(function (p) { return p.hidden; }).length;
    $('count').textContent = q ? bn(shown.length) + 'টি পণ্য পাওয়া গেছে (মোট ' + bn(products.length) + ')'
      : 'মোট ' + bn(products.length) + 'টি পণ্য' + (hiddenCount ? ', লুকানো ' + bn(hiddenCount) + 'টি' : '');
    if (!shown.length) {
      $('list').replaceChildren(el('div', { class: 'empty', text: products.length ? 'কিছু পাওয়া যায়নি' : 'কোনো পণ্য আসেনি' }));
      return;
    }
    $('list').replaceChildren.apply($('list'), shown.map(row));
  }

  function row(p) {
    var img = (p.images && p.images[0]) || '';
    var thumb = img ? el('img', { class: 'thumb', src: img, alt: '', loading: 'lazy' }) : el('div', { class: 'thumb' });
    var priceLine = [document.createTextNode('৳' + bn(p.price))];
    if (p.price !== p.bkPrice) priceLine.push(el('span', { class: 'tag', text: 'মূল ৳' + bn(p.bkPrice) }));
    if (p.hidden) priceLine.push(el('span', { class: 'tag off', text: 'লুকানো' }));
    else if (!p.inStock) priceLine.push(el('span', { class: 'tag off', text: 'স্টক নেই' }));
    return el('div', { class: 'row' }, [
      thumb,
      el('div', { class: 'info' }, [
        el('div', { class: 'name', text: p.name }),
        el('div', { class: 'price' }, priceLine)
      ]),
      el('div', { class: 'acts' }, [
        el('button', { class: 'btn sm', type: 'button', text: 'এডিট', onclick: function () { openEditor(p); } }),
        el('button', { class: 'btn sm', type: 'button', text: p.hidden ? 'দেখান' : 'লুকান', onclick: function () { toggleHidden(p); } })
      ])
    ]);
  }
  $('q').addEventListener('input', render);

  function replaceLocal(u) {
    var i = products.findIndex(function (x) { return x.id === u.id; });
    if (i > -1) products[i] = u;
  }

  function save(p, body, okMsg) {
    return request('PUT', '/admin/products/' + encodeURIComponent(p.id), body, token).then(function (u) {
      replaceLocal(u); render(); toast(okMsg); return u;
    });
  }

  function toggleHidden(p) {
    save(p, { hidden: !p.hidden }, p.hidden ? 'দোকানে দেখানো হবে' : 'দোকান থেকে লুকানো হয়েছে')
      .catch(function (e) { if (!onAuthFail(e)) toast(e.message, true); });
  }

  /* ── এডিটর ── */
  function openEditor(p) {
    editing = p;
    $('dlgTitle').textContent = 'পণ্য এডিট';
    $('fName').value = p.name;
    $('fPrice').value = p.price;
    $('fDesc').value = p.description || '';
    $('fImages').value = (p.images || []).join('\n');
    $('priceHint').textContent = 'মূল দাম ৳' + bn(p.bkPrice) + (typeof p.minPrice === 'number' ? ' · সর্বনিম্ন ৳' + bn(p.minPrice) : '');
    $('resetBtn').hidden = !p.edited;
    $('formErr').textContent = '';
    $('dlg').showModal();
  }
  $('cancel').addEventListener('click', function () { $('dlg').close(); });

  $('resetBtn').addEventListener('click', function () {
    if (!confirm('নাম, দাম, বর্ণনা ও ছবি আবার Business Koro-র মূল মানে ফিরবে। চালিয়ে যাবেন?')) return;
    $('resetBtn').disabled = true;
    save(editing, { reset: true, hidden: !!editing.hidden }, 'মূল মান ফেরানো হয়েছে').then(function () { $('dlg').close(); })
      .catch(function (e) { if (e.status === 401) { $('dlg').close(); onAuthFail(e); } else $('formErr').textContent = e.message; })
      .finally(function () { $('resetBtn').disabled = false; });
  });

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('fName').value.trim(), price = Number($('fPrice').value);
    if (!name) { $('formErr').textContent = 'পণ্যের নাম দিন'; return; }
    if (!(price >= 0)) { $('formErr').textContent = 'দাম সঠিক নয়'; return; }
    var body = {
      name: name, price: Math.round(price), description: $('fDesc').value,
      images: $('fImages').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
    };
    $('save').disabled = true; $('formErr').textContent = '';
    save(editing, body, 'সেভ হয়েছে').then(function () { $('dlg').close(); }).catch(function (e) {
      if (e.status === 401) { $('dlg').close(); onAuthFail(e); } else $('formErr').textContent = e.message;
    }).finally(function () { $('save').disabled = false; });
  });

  /* ── শুরু ── */
  token = store(true);
  if (!token) { showLogin(); return; }
  request('POST', '/admin/auth', {}, token).then(showApp).catch(function (e) {
    if (e.status === 401) { token = ''; store(false, ''); showLogin(); }
    else { showLogin(e.message); }
  });
})();
</script>
</body>
</html>
